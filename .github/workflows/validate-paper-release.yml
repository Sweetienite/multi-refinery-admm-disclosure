name: Validate paper release
on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r figures_final_release/requirements.txt
      - run: python figures_final_release/code/verify_release.py
      - run: python scripts/validate_paper_release_20260717.py
