name: Validate paper release
on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/verify_release.py
      - run: python scripts/validate_public_release.py
      - run: python tools/verify_public_export.py --root . --strict --report public_export_scan.json
      - run: python scripts/generate_paper_figures.py --data-dir data --output-dir /tmp/paper-figures
