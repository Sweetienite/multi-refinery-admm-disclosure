# main_case.yaml — Case parameters for the H15 paper case
#
# This case is derived from publicly available refinery-petrochemical
# production planning benchmark parameters (see data/README.md and NOTICE.md
# for provenance). It is designed for methodological validation of the
# ADMM-based coordination and disclosure-control framework.
#
# Model description:
#   Refinery A holds 5 production streams (s147, s158, s53, s61, s545).
#   Refinery B holds 5 production streams (s36, s391, s455, s376, s65).
#   Each stream has a product price (CNY/kt) and flow bounds.
#
#   Standalone: each plant maximises revenue subject to its own streams and
#               a plant capacity = sum(fv_max for its streams).
#
#   Coordinated: each stream's upper bound is doubled (coord_ub_multiplier=2),
#                and total production is bounded by the joint system capacity
#                (= sum of all fv_max = 8.15 kt).
#
# The capacity-sharing ADMM decomposes this joint problem into two plant
# sub-problems connected by the shared system capacity constraint.

scenario_id: H15_dual_refinery_coordination_v1

# ── Refinery A parameters ────────────────────────────────────────────────────
refineries:
  A:
    # Product price (CNY/kt) — derived from Case3 benchmark all_parameters.txt
    price:
      s147: 8520000.0
      s158: 7180000.0
      s53:  6800000.0
      s61:  6080000.0
      s545: 4965000.0
    # Minimum production (kt/period) — fv_min from benchmark
    flow_min:
      s147: 0.0
      s158: 0.0
      s53:  0.0
      s61:  0.0
      s545: 0.26
    # Maximum production (kt/period) — fv_max from benchmark
    flow_max:
      s147: 0.94
      s158: 0.57
      s53:  0.74
      s61:  0.70
      s545: 0.27

  # ── Refinery B parameters ──────────────────────────────────────────────────
  B:
    # Product price (CNY/kt) — derived from Case3 benchmark all_parameters.txt
    price:
      s36:  7600000.0
      s391: 7100000.0
      s455: 6780000.0
      s376: 5828000.0
      s65:  4730000.0
    # Minimum production (kt/period)
    flow_min:
      s36:  0.0
      s391: 0.0
      s455: 0.0
      s376: 0.0
      s65:  0.0
    # Maximum production (kt/period) — fv_max from benchmark
    flow_max:
      s36:  0.43
      s391: 1.84
      s455: 2.00
      s376: 0.49
      s65:  0.17

# ── Coordination parameters ──────────────────────────────────────────────────
coordination:
  # In the coordinated model, each stream's UB = coord_ub_multiplier * fv_max
  coord_ub_multiplier: 2.0
  # Total system capacity (kt/period) = sum of all fv_max = 8.15
  # Set explicitly to avoid floating-point accumulation issues
  total_system_capacity: 8.15

# ── ADMM hyper-parameters (paper-reported settings) ─────────────────────────
admm:
  rho: 0.10
  max_iter: 500
  primal_tol: 0.001
  dual_tol: 0.001
  # Revenue normalisation factor to improve ADMM conditioning
  profit_scale: 1000000.0
