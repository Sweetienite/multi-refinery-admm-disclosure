# disclosure_mechanisms.yaml — Disclosure mechanism configurations
#
# Three disclosure-control mechanisms are evaluated in the paper (Table 4):
#   1. none        — No disclosure control; full ADMM trajectory visible (baseline)
#   2. ts_ladder   — Adaptive threshold-ladder mechanism (main paper mechanism)
#   3. bucketing   — Stream-bucketing mechanism (alternative main mechanism)
#
# A fourth "hard_mask" boundary mechanism is discussed but not in the main evaluation.

mechanisms:
  - id: none
    label: "No disclosure control (distributed baseline)"
    role: "baseline"
    description: >
      All exact ADMM iteration values are observable on the public channel.
      This establishes the baseline exposure score.

  - id: ts_ladder
    label: "Adaptive threshold-ladder"
    role: "main_evaluation"
    description: >
      Streams with flow below a relative threshold are masked (identity hidden).
      Active streams are reported as intervals of width bucket_width_ratio * capacity.
      This is the primary mechanism evaluated in the paper (Table 4, columns 3).
    params:
      threshold_ratio: 0.15       # streams below 15% of capacity are masked
      bucket_width_ratio: 0.10    # interval width = 10% of stream capacity

  - id: bucketing
    label: "Stream bucketing"
    role: "main_evaluation"
    description: >
      Each stream value is quantised into n_buckets equal-width buckets.
      Only the bucket index is reported, not the exact value.
      This is the alternative mechanism (Table 4, columns 4).
    params:
      n_buckets: 5

  - id: hard_mask
    label: "Hard masking (boundary case)"
    role: "boundary_illustration"
    description: >
      All stream identities are masked. Only aggregate capacity usage is reported.
      Included only as a boundary illustration; not in the main evaluation tables.
    params:
      mask_all: true

# Exposure score weight schemes evaluated (Table 5):
weight_schemes:
  main:
    direct: 0.25
    corridor: 0.20
    temporal: 0.20
    bottleneck: 0.20
    side: 0.15
  uniform:
    direct: 0.20
    corridor: 0.20
    temporal: 0.20
    bottleneck: 0.20
    side: 0.20
  direct_heavy:
    direct: 0.40
    corridor: 0.15
    temporal: 0.15
    bottleneck: 0.15
    side: 0.15
  trajectory_heavy:
    direct: 0.15
    corridor: 0.15
    temporal: 0.25
    bottleneck: 0.25
    side: 0.20
  side_heavy:
    direct: 0.15
    corridor: 0.15
    temporal: 0.15
    bottleneck: 0.20
    side: 0.35
